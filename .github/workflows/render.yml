name: Render "THE 3:00 AM MIMIC" (1080p 60fps)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition to render'
        required: true
        default: 'MimicShort'
        type: choice
        options:
          - MimicShort
          - MimicShort-ReelsSafeZone
          - ProjectBlueBook

jobs:
  render:
    name: Generate 3D & Render Full HD Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Blender & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg mesa-vulkan-drivers vulkan-tools xvfb

      - name: Generate All 8 3D Shots with Blender
        run: |
          echo "=== RUNNING BLENDER 3D HEADLESS PIPELINE (EEVEE) ==="
          if command -v xvfb-run &> /dev/null; then
            xvfb-run -a blender -b -P generate_3am_mimic_shots.py
          else
            blender -b -P generate_3am_mimic_shots.py
          fi
          echo "=== VERIFYING RENDERED SHOTS ==="
          ls -lh public/renders/

      - name: Pre-Bundle Remotion Code
        run: npx remotion bundle src/index.ts build

      - name: Render Full 55s 1080p 60fps Short
        run: |
          mkdir -p out
          COMP="${{ github.event.inputs.composition || 'MimicShort' }}"
          echo "Rendering composition: $COMP"
          npx remotion render build "$COMP" out/mimic_3am_1080p_60fps.mp4 \
            --pixel-format=yuv420p \
            --codec=h264 \
            --crf=16 \
            --concurrency=4 \
            --overwrite

      - name: Upload Video Artifact (1-Click Download)
        uses: actions/upload-artifact@v4
        with:
          name: mimic-3am-1080p-60fps
          path: out/mimic_3am_1080p_60fps.mp4
          retention-days: 14
