name: Render "THE 3:00 AM MIMIC" (1080p 60fps)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Stage 1: Render All 8 Modular Shots in Parallel across 8 Cloud Runners
  render-shots:
    name: Render Shot 0${{ matrix.shot }} (EEVEE Full HD)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Blender, FFmpeg & Mesa Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg mesa-vulkan-drivers vulkan-tools xvfb

      - name: Render 3D Shot 0${{ matrix.shot }}
        run: |
          echo "=== RENDERING SHOT 0${{ matrix.shot }} IN PARALLEL (EEVEE) ==="
          if command -v xvfb-run &> /dev/null; then
            xvfb-run -a blender -b -P generate_3am_mimic_shots.py -- --shot ${{ matrix.shot }}
          else
            blender -b -P generate_3am_mimic_shots.py -- --shot ${{ matrix.shot }}
          fi
          ls -lh public/renders/

      - name: Upload Shot 0${{ matrix.shot }} MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shot_0${{ matrix.shot }}
          path: public/renders/shot_0${{ matrix.shot }}.mp4
          retention-days: 1

  # Stage 2: Assemble Remotion Composition & Render 1080p Master Video
  assemble-master:
    name: Assemble Remotion Master & Export Video (1080p 60fps)
    needs: render-shots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Download All 8 Shot Artifacts
        uses: actions/download-artifact@v4
        with:
          path: public/renders/
          merge-multiple: true

      - name: Verify All 8 Modular Shots Ready
        run: |
          echo "=== VERIFYING DOWNLOADED MODULAR SHOTS ==="
          ls -lh public/renders/

      - name: Pre-Bundle Remotion Code
        run: npx remotion bundle src/index.ts build

      - name: Render Full 55s 1080p 60fps Master Short
        run: |
          mkdir -p out
          echo "Rendering composition: MimicShort"
          npx remotion render build MimicShort out/mimic_3am_1080p_60fps.mp4 \
            --pixel-format=yuv420p \
            --codec=h264 \
            --crf=16 \
            --concurrency=4 \
            --overwrite

      - name: Upload Final Instagram Master Video (1-Click Download)
        uses: actions/upload-artifact@v4
        with:
          name: mimic-3am-1080p-60fps
          path: out/mimic_3am_1080p_60fps.mp4
          retention-days: 14
